# Backend + LiveKit (audio calls) + Egress (call recording) + Redis.
# The frontend runs with `npm run dev` (see README).
services:
  redis:
    user: root
    image: redis:7-alpine

  livekit:
    user: root
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"        # signalling (WebSocket) + HTTP API
      - "7881:7881"        # WebRTC over TCP (fallback)
      - "7882:7882/udp"    # WebRTC over UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  egress:
    user: root
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 8080
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./data/recordings:/out      # recordings land here ...
    depends_on: [livekit, redis]

  backend:
    user: root
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LIVEKIT_URL: ws://localhost:7880          # what the browser connects to
      LIVEKIT_API_URL: http://livekit:7880      # what the backend calls
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE}
      DRAFTER: ${DRAFTER:-placeholder}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen}
      LLM_MODE: ${LLM_MODE:-extract}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-120}
      JWT_SECRET: ${JWT_SECRET:-}   # empty = random per start (everyone logged out on restart)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-qadam-demo}
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data/recordings:/data/recordings      # ... and are read here
      - qadam-db:/data
      - whisper-cache:/root/.cache/huggingface  # Whisper weights are downloaded once
    depends_on: [livekit]

  # Self-hosted LLM for the drafter (DRAFTER=llm). Off by default: `docker compose --profile llm up`.
  # Put the GGUF file into ./data/models (see README, "LLM drafter"). Limits mirror the dev stand: one CPU core;
  # Qwen3-1.7B Q4_K_M peaked at ~1.45 GB RSS with this context size.
  llm:
    profiles: [llm]
    image: ghcr.io/ggml-org/llama.cpp@sha256:ca40726778c25a7fadce42c09bada8484eab22e28bc283bdbf212e87b1555390  # server build used in the evals
    command: -m /models/${LLM_MODEL_FILE:-Qwen3-1.7B-Q4_K_M.gguf} -c 2048 -t 1 -np 1 --host 0.0.0.0 --port 8080
    volumes:
      - ./data/models:/models:ro
    cpus: 1
    mem_limit: 1600m

volumes:
  qadam-db:
  whisper-cache:
